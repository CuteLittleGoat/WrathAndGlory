<!DOCTYPE html>
<!-- Plik interfejsu modułu: struktura sekcji i elementy interaktywne / Module UI file: section structure and interactive elements -->
<html lang="pl">
<!-- Sekcja konfiguracji dokumentu i zasobów / Document configuration and asset section -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DiceRoller - Wrath & Glory</title>
  <link rel="stylesheet" href="style.css">
</head>
<!-- Główna sekcja widoczna dla użytkownika / Main section visible to the user -->
<body>
  <!-- Główna zawartość modułu / Main module content -->
<main class="app">
    <div class="language-switcher">
      <!-- MIEJSCE ZMIANY WIDOCZNOŚCI PRZEŁĄCZNIKA JĘZYKA / LANGUAGE SWITCHER VISIBILITY CHANGE POINT: usuń klasę language-switcher--hidden, aby pokazać przełącznik / remove language-switcher--hidden to make the switcher visible -->
      <select id="languageSelect" class="language-switcher--hidden" aria-label="Wersja językowa">
        <option value="pl">Polski</option>
        <option value="en">English</option>
      </select>
      <a id="mainPageButton" class="nav-button" href="../Main/index.html">Strona Główna</a>
    </div>
    <!-- Nagłówek nawigacyjny lub informacyjny / Navigation or information header -->
<header class="app__header">
      <h1 id="pageTitle">DiceRoller</h1>
      <p class="app__subtitle" id="subtitle">Symulacja rzutów kośćmi dla Wrath &amp; Glory</p>
    </header>

    <!-- Wydzielona sekcja funkcjonalna / Dedicated functional section -->
<section class="panel">
      <div class="field">
        <label for="difficulty" id="difficultyLabel">Stopień Trudności</label>
        <input id="difficulty" type="number" min="1" max="99" value="3" step="1">
      </div>
      <div class="field">
        <label for="pool" id="poolLabel">Pula Kości</label>
        <input id="pool" type="number" min="1" max="99" value="2" step="1">
      </div>
      <div class="field">
        <label for="wrath" id="wrathLabel">Ilość Kości Furii</label>
        <input id="wrath" type="number" min="1" max="99" value="1" step="1">
        <span class="field__hint" id="wrathHint">Nie większa niż Pula Kości.</span>
      </div>
      <button class="roll" id="roll">Rzuć Kośćmi!</button>
    </section>

    <section class="results">
      <div class="dice" id="dice"></div>
      <!-- PL: Podsumowanie ma zawsze cztery wiersze, także puste. Dzięki temu strona nie skacze
               w pionie, gdy po jednoliniowym komunikacie pojawia się kilkuliniowy wynik.
           EN: The summary always has four rows, empty ones included. That keeps the page from
               jumping vertically when a one-line message is replaced by a multi-line result. -->
      <div class="summary" id="summary">
        <p class="summary__line summary__placeholder" id="summaryPlaceholder">Wpisz parametry i rzuć kośćmi, aby zobaczyć wynik.</p>
        <p class="summary__line"></p>
        <p class="summary__line"></p>
        <p class="summary__line"></p>
      </div>
      <details class="rollDetails" id="rollDetails">
        <summary class="rollDetails__toggle" id="rollDetailsToggle">Detale rzutu</summary>
        <div class="rollDetails__body" id="rollDetailsBody"></div>
      </details>
    </section>
  </main>

  <!-- Skrypt odpowiedzialny za interakcję strony / Script responsible for page interactions -->
<script src="script.js"></script>
</body>
</html>
